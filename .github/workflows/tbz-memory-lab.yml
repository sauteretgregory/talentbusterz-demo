name: TBZ Memory Lab

on:
  push:
    branches:
      - lab/candidate-memory-sqlite-v0
  workflow_dispatch:

jobs:
  sqlite-memory-lab:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run Candidate Memory tests
        run: node --test server/repositories/sqliteCandidateMemoryRepository.test.js server/repositories/sqliteCandidateMemoryRepository.integration.test.js
